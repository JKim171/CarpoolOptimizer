name: PostGIS image

# The production database image. It changes rarely, so it is built only when its Dockerfile does,
# or by hand, and deploy/compose.yml pins the digest this prints -- updating the pin is a reviewed
# commit, never something a build does on its own.
on:
  push:
    branches: [main]
    paths: [docker/postgres/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A docker-container builder, so the digest in the build metadata is the manifest that was
      # pushed. The default driver can report the image config's digest, which does not pull.
      - run: docker buildx create --use --driver docker-container --driver-opt image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ghcr.io/jkim171/carpool-postgres
        run: |
          docker buildx build --push --platform linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE:16" --tag "$IMAGE:$GITHUB_SHA" --metadata-file meta.json docker/postgres
          digest=$(jq -r '."containerimage.digest"' meta.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$digest" > /dev/null
          echo "Built \`$IMAGE@$digest\` from \`$GITHUB_SHA\`. Pin this digest in deploy/compose.yml." >> "$GITHUB_STEP_SUMMARY"

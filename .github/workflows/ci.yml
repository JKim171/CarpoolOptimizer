name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # These steps mirror `make check`. The Makefile runs them out of .venv/; CI has its own
  # environment, so the commands are spelled out rather than shelling into the Makefile.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -U pip -r requirements-dev.txt -e packages/domain -e 'apps/api[test]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy packages/domain/src apps/api/src
      # The integration tests run this exact image through testcontainers, so it has to exist
      # locally first. Without it they skip rather than fail, which would hide a broken schema.
      - run: docker build -t carpool-postgres:16 docker/postgres
      - run: pytest

  # Mirrors `make web-check`, plus a production build -- the build is the only step that catches a
  # page that typechecks but cannot render.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      # Baked into the bundle at build time, so the build needs a value. This one is never used:
      # CI renders no page against a real API.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.invalid

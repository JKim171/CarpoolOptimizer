name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -U pip -r requirements-dev.txt -e packages/domain
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy packages/domain/src
      - run: pytest

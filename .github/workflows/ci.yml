name: CI

on:
  push: { branches: [main] }
  pull_request:

# Every job starts from read-only access. A job that needs more -- the deploy's id-token and
# packages grants -- asks for it in its own block, so no other job inherits it.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # These steps mirror `make setup` and `make check`. The Makefile runs them out of .venv/; CI has
  # its own environment, so the commands are spelled out rather than shelling into the Makefile.
  # Actions are pinned by commit SHA, since a tag can be moved; the comment names the release.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -U pip
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install --no-deps -e packages/domain -e apps/api
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: pip-audit --disable-pip --require-hashes -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy packages/domain/src apps/api/src
      # The integration tests run this exact image through testcontainers, so it has to exist
      # locally first. Without it they skip rather than fail, which would hide a broken schema.
      - run: docker build -t carpool-postgres:16 docker/postgres
      - run: pytest

  # Mirrors `make web-check`, plus a production build -- the build is the only step that catches a
  # page that typechecks but cannot render.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      # Baked into the bundle at build time, so the build needs a value. This one is never used:
      # CI renders no page against a real API.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.invalid

  # Build the API image for the instance (Graviton, so arm64 -- built natively on an arm64 runner
  # rather than emulated) and push it to GHCR. Only after both checks pass, and only for main.
  # The digest the push returns is what a deploy names; the SHA tag is for people, and nothing
  # deploys from it (docs/design.md 10.1).
  image:
    needs: [check, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A docker-container builder, so the digest in the build metadata is the manifest that was
      # pushed. The default driver can report the image config's digest, which does not pull.
      - run: docker buildx create --use --driver docker-container --driver-opt image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        env:
          IMAGE: ghcr.io/jkim171/carpooloptimizer
        run: |
          docker buildx build --push --platform linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE:$GITHUB_SHA" --metadata-file meta.json .
          digest=$(jq -r '."containerimage.digest"' meta.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$digest" > /dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Built \`$IMAGE@$digest\` from \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"

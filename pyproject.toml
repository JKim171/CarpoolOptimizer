# Root config: tooling only. Packages live under packages/ and apps/.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/domain/src", "apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PT"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "packages/domain/src:apps/api/src"

# Alembic revisions are generated from a template and are scripts, not library code.
[[tool.mypy.overrides]]
module = "alembic.versions.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["packages/domain/tests", "apps/api/tests"]
addopts = "-q --strict-markers"
# Integration tests are async throughout; `auto` keeps a bare `async def test_` working without an
# opt-in marker on every one.
asyncio_mode = "auto"
# Must match the loop scope tests themselves run in (function), or an async fixture that opens a
# database connection binds it to a different event loop than the test body uses, and asyncpg fails
# with "attached to a different loop". The session-scoped fixtures in the integration suite
# (`postgres_url`, `migrated_url`) are deliberately synchronous, so nothing needs a wider scope.
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carpool-bench"
version = "0.1.0"
description = "Benchmark harness for CarpoolOptimizer's solvers, and the exact model that measures them."
requires-python = ">=3.12"
dependencies = ["carpool-domain", "ortools>=9.15,<10"]

[tool.setuptools.packages.find]
where = ["src"]
